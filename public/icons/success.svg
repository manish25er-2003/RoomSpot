<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Payment success">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <g transform="translate(8,8)">
    <circle cx="72" cy="72" r="64" fill="#ecfeff" />
    <g transform="translate(24,24)">
      <circle cx="48" cy="48" r="48" fill="url(#g1)" opacity="0.12" />
      <g id="check" transform="translate(12,12)">
        <path d="M10 28 L22 40 L54 8" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
      </g>
      <g id="burst">
        <rect x="0" y="-8" width="6" height="14" rx="2" fill="#f97316">
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" begin="0s" dur="1.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="84" y="90" width="6" height="14" rx="2" fill="#60a5fa" transform="rotate(45 87 97)">
          <animateTransform attributeName="transform" type="translate" values="0 0; -4 -12; 0 0" begin="0.12s" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
  <g transform="translate(40,30)">
    <g>
      <circle cx="40" cy="40" r="40" fill="#fff" opacity="0" />
      <animateTransform attributeName="transform" type="scale" values="0.92;1.06;1" dur="0.9s" repeatCount="1" begin="0s"/>
    </g>
  </g>
</svg>
