<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Payment failed">
  <g>
    <circle cx="80" cy="80" r="72" fill="#fff1f2" />
    <g transform="translate(36,36)">
      <g id="xmark">
        <line x1="6" y1="6" x2="56" y2="56" stroke="#ef4444" stroke-width="6" stroke-linecap="round">
          <animate attributeName="x2" values="56;62;56" dur="1.2s" repeatCount="indefinite"/>
        </line>
        <line x1="56" y1="6" x2="6" y2="56" stroke="#ef4444" stroke-width="6" stroke-linecap="round">
          <animate attributeName="x2" values="6;0;6" dur="1.2s" repeatCount="indefinite"/>
        </line>
      </g>
      <g id="shake" transform="translate(0,0)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 6 0; -6 0; 0 0" dur="0.6s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(40,110)">
      <text x="0" y="0" font-size="12" fill="#ef4444" font-weight="700">Payment failed</text>
    </g>
  </g>
</svg>
